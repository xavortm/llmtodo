[package]
name = "llmtodo-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

# GPUI Kit is pinned to one git revision. GPUI comes through GPUI Kit, which
# pins `gpui-pre =0.3.12` from crates.io at that revision. Do not add a
# separate GPUI dependency: it must stay the exact one GPUI Kit compiles with.
# Upgrade both together, and move ~/code/oss/gpui-component with them.
[features]
# The demo data, for `llmtodo-ui-bench`. It turns on no `test-support`.
bench-support = []

[dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-component", rev = "1029e2c5d34d75fa82ab5f0f067771951a88d993", features = ["tree-sitter-markdown", "tree-sitter-markdown-inline"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2.1"

# The API. The client is async on tokio, so `backend.rs` runs it on its own
# runtime thread and sends results to GPUI over a channel.
llmtodo-client = { path = "../client" }
llmtodo-api-types = { path = "../api-types" }
llmtodo-core = { path = "../core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3.34"
jiff = "0.2.42"
# GPUI's HTTP client, for remote images in the Markdown preview. The same
# version as the GPUI that GPUI Kit pins, as GPUI Kit's story app uses.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.12" }
uuid = "1.29.2"
# The string type the model holds. It is the same type GPUI uses, without
# GPUI, so the model needs no GPUI import. Keep it on the GPUI version.
gpui-shared-string = { package = "gpui-pre-shared-string", version = "=0.3.12" }
# The edit type of GPUI Kit's `SyntaxHighlighter::update`, for incremental
# parsing in `fold_highlighter.rs`. Keep it on GPUI Kit's version.
tree-sitter = "=0.26.13"
# Background images (LLM-573): decode, shrink, blur and step through
# frames ourselves. The same version and formats GPUI already compiles.
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp", "bmp", "tiff", "qoi", "rayon"] }
# Shader backgrounds (LLM-578): WGSL and GLSL translate to Metal Shading
# Language with naga, and run on our own Metal pipeline. naga is the same
# version wgpu uses elsewhere in the lockfile; objc2-metal is the version
# GPUI's macOS renderer already compiles.
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in", "glsl-in", "msl-out"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["net", "io-util"] }
# Tests run the real server in-process, as the CLI tests do.
llmtodo-server = { path = "../server" }
gpui-kit = { git = "https://github.com/longbridge/gpui-component", rev = "1029e2c5d34d75fa82ab5f0f067771951a88d993", features = ["tree-sitter-markdown", "tree-sitter-markdown-inline", "test-support"] }

# Sets the Dock icon when the app runs outside a .app bundle, as with
# `cargo run`, and draws a preview build's icon (LLM-592). Same versions
# GPUI's macOS backend already uses. Try it brings an open preview build
# forward through NSWorkspace (LLM-591).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSAttributedString", "NSBezierPath", "NSColor", "NSDockTile", "NSFont", "NSImage", "NSResponder", "NSRunningApplication", "NSStringDrawing", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSAttributedString", "NSData", "NSDictionary", "NSGeometry", "NSString", "NSError", "NSURL"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLAllocation", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLLibrary", "MTLPixelFormat", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLRenderPipeline", "MTLResource", "MTLTexture", "MTLTypes"] }
# LLM-579: a shader frame goes to GPUI's `surface()` as an IOSurface-backed
# YCbCr pixel buffer, with no copy through the CPU. The versions GPUI's
# macOS renderer already compiles.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVMetalTexture", "CVMetalTextureCache", "CVReturn", "objc2", "objc2-metal"] }
