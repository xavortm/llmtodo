[package]
name = "llmtodo-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
flate2 = "1.1.11"
futures-util = "0.3.34"
hex = "0.4.3"
jiff = { version = "0.2.42", features = ["serde"] }
llmtodo-api-types = { version = "0.1.0", path = "../api-types" }
llmtodo-core = { version = "0.1.0", path = "../core" }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v7", "serde"] }

[dev-dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
