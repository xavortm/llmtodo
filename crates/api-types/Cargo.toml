[package]
name = "llmtodo-api-types"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jiff = { version = "0.2.42", features = ["serde"] }
llmtodo-core = { version = "0.1.0", path = "../core" }
schemars = { version = "1.2.3", features = ["jiff02", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.2", features = ["v7", "serde"] }
