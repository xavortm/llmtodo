[package]
name = "llmtodo-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
jiff = "0.2.42"
llmtodo-api-types = { version = "0.1.0", path = "../api-types" }
llmtodo-core = { version = "0.1.0", path = "../core" }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "time", "fs", "macros", "net"] }
tokio-tungstenite = "0.30.0"
toml = "1.2.1"
uuid = { version = "1.29.2", features = ["v7"] }

[dev-dependencies]
llmtodo-server = { version = "0.1.0", path = "../server" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
