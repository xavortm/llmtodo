[package]
name = "llmtodo-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# The binary only opens the window. The views and the model live in
# `llmtodo-ui`, so `llmtodo-ui-bench` can draw them without GPUI's
# `test-support` feature, which the library's tests turn on.
[dependencies]
llmtodo-ui = { path = "../ui" }
gpui-kit = { git = "https://github.com/longbridge/gpui-component", rev = "1029e2c5d34d75fa82ab5f0f067771951a88d993", features = ["tree-sitter-markdown", "tree-sitter-markdown-inline"] }
# GPUI's HTTP client, for remote images in the Markdown preview.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.12" }
