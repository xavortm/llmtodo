[package]
name = "llmtodo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "string"] }
jiff = "0.2.42"
llmtodo-api-types = { version = "0.1.0", path = "../api-types" }
llmtodo-client = { version = "0.1.0", path = "../client" }
llmtodo-core = { version = "0.1.0", path = "../core" }
llmtodo-server = { version = "0.1.0", path = "../server" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"

[[bin]]
name = "llmtodo"
path = "src/main.rs"

[dev-dependencies]
axum = "0.8.9"
assert_cmd = "2.2.2"
tempfile = "3.27.0"
